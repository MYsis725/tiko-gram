<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiko Gram 🇺🇦 Мгновенный P2P Чат</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b141a; color: #e9edef; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 450px; height: 100vh; max-height: 700px; display: flex; flex-direction: column; background: #222e35; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .chat-header { background: #202c33; padding: 15px; text-align: center; border-bottom: 1px solid #374248; }
        .chat-header h2 { font-size: 1.2rem; color: #00a884; }
        .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-color: #0b141a; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; word-break: break-word; }
        .msg.incoming { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .msg.outgoing { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .msg .username { font-size: 0.75rem; color: #00a884; font-weight: bold; margin-bottom: 3px; }
        .chat-input-area { background: #202c33; padding: 10px; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; background: #2a3942; border: none; padding: 12px; border-radius: 8px; color: #fff; font-size: 1rem; outline: none; }
        button { background: #00a884; border: none; color: #fff; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #008f72; }
        .setup-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0b141a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; gap: 15px; text-align: center; padding: 20px; }
        .code-box { background: #2a3942; padding: 10px; border-radius: 8px; font-weight: bold; color: #00a884; margin: 10px 0; font-size: 1.2rem; }
    </style>
    <!-- Подключаем надежную P2P библиотеку через официальный архив cdnjs -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <!-- Экран подключения -->
    <div id="setup" class="setup-screen">
        <h2>Добро пожаловать в Tiko Gram</h2>
        <p style="color: #8696a0;">Ваш личный секретный код для связи:</p>
        <div class="code-box" id="my-id-display">Генерация кода...</div>
        
        <input type="text" id="username-input" placeholder="Введите ваш ник (например, Макс)" style="background: #2a3942; border: none; padding: 12px; border-radius: 8px; color: #fff; text-align: center; outline: none; margin-bottom: 10px; width: 260px;"><br>
        
        <p style="color: #8696a0;">Чтобы подключиться к другу, введите ЕГО код:</p>
        <input type="text" id="peer-id-input" placeholder="Код друга из другого города" style="background: #2a3942; border: none; padding: 12px; border-radius: 8px; color: #fff; text-align: center; outline: none; width: 260px;"><br>
        
        <button onclick="startChat()">Запустить чат</button>
    </div>

    <!-- Окно мессенджера -->
    <div class="chat-container">
        <div class="chat-header">
            <h2>Tiko Gram 🇺🇦 Прямой P2P Канал</h2>
        </div>
        <div class="messages-box" id="messages"></div>
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Напишите сообщение..." onkeypress="handleKey(event)">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        var peer = new Peer(); // Создаем прямое P2P подключение
        var conn = null;
        var myName = "Пользователь";

        // Показываем твой личный уникальный код, как только он сгенерируется
        peer.on('open', function(id) {
            document.getElementById('my-id-display').innerText = id;
        });

        // Слушаем, если кто-то другой вводит наш код и подключается к нам
        peer.on('connection', function(incomingConn) {
            conn = incomingConn;
            setupConnection();
            document.getElementById('setup').style.display = 'none';
        });

        function startChat() {
            var nameInput = document.getElementById('username-input').value.trim();
            if (nameInput !== "") myName = nameInput;

            var peerId = document.getElementById('peer-id-input').value.trim();
            
            if (peerId !== "") {
                // Если мы сами ввели код друга — подключаемся к нему напрямую
                conn = peer.connect(peerId);
                setupConnection();
                document.getElementById('setup').style.display = 'none';
            } else {
                alert("Если к вам подключаются — просто ждите. Если вы подключаетесь — введите код друга в нижнее поле!");
            }
        }

        function setupConnection() {
            // Когда соединение установлено, слушаем сообщения
            conn.on('data', function(data) {
                if (data.user && data.text) {
                    displayMessage(data.user, data.text, false);
                }
            });
        }

        function sendMessage() {
            var input = document.getElementById('msg-input');
            var text = input.value.trim();
            if (text !== "" && conn) {
                // Отправляем пакет данных напрямую в браузер друга
                conn.send({ user: myName, text: text });
                displayMessage(myName, text, true);
                input.value = "";
            }
        }

        function handleKey(e) { if (e.key === 'Enter') sendMessage(); }

        function displayMessage(user, text, isMe) {
            var box = document.getElementById('messages');
            var msgDiv = document.createElement('div');
            msgDiv.classList.add('msg', isMe ? 'outgoing' : 'incoming');
            msgDiv.innerHTML = '<div class="username">' + user + '</div><div>' + text + '</div>';
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
