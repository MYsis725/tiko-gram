<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiko Gram 🇺🇦</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b141a; color: #e9edef; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 450px; height: 100vh; max-height: 700px; display: flex; flex-direction: column; background: #222e35; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .chat-header { background: #202c33; padding: 15px; text-align: center; border-bottom: 1px solid #374248; }
        .chat-header h2 { font-size: 1.2rem; color: #00a884; }
        .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-color: #0b141a; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; word-break: break-word; }
        .msg.incoming { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .msg.outgoing { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .msg .username { font-size: 0.75rem; color: #00a884; font-weight: bold; margin-bottom: 3px; }
        .chat-input-area { background: #202c33; padding: 10px; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; background: #2a3942; border: none; padding: 12px; border-radius: 8px; color: #fff; font-size: 1rem; outline: none; }
        button { background: #00a884; border: none; color: #fff; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #008f72; }
        .setup-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0b141a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; gap: 15px; }
    </style>
</head>
<body>

    <div id="setup" class="setup-screen">
        <h2>Добро пожаловать в Tiko Gram</h2>
        <p style="color: #8696a0;">Чат для всей Украины</p>
        <input type="text" id="username-input" placeholder="Введите ваш ник" style="background: #2a3942; border: none; padding: 12px; border-radius: 8px; color: #fff; text-align: center; outline: none;">
        <button onclick="startChat()">Войти в чат</button>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <h2>Tiko Gram 🇺🇦 Онлайн Мессенджер</h2>
        </div>
        <div class="messages-box" id="messages"></div>
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Напишите сообщение..." onkeypress="handleKey(event)">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        var currentUsername = "";
        var room = "tikogram_live_room";
        var serverUrl = "";

        // !!! ВАЖНО: УДАЛИ ВСЕ ПРОБЕЛЫ ВНУТРИ СЛЕДУЮЩЕЙ СТРОКИ, ЧТОБЫ ПОЛУЧИЛСЯ АДРЕС: https://piehost.com
        var mainDomain = "https : // piehost . com"; 
        
        // !!! И УДАЛИ ВСЕ ПРОБЕЛЫ ТУТ, ЧТОБЫ ПОЛУЧИЛСЯ АДРЕС: wss://://piehost.com
        var wsDomain = "wss : // us-mv . piehost . com";

        function startChat() {
            var input = document.getElementById('username-input');
            if (input.value.trim() !== "") {
                currentUsername = input.value.trim();
                document.getElementById('setup').style.display = 'none';
                initChat();
            }
}

        function initChat() {
            var cleanWs = wsDomain.replace(/\s/g, "");
            var socketUrl = cleanWs + "/v1/" + room + "?apikey=o776f87f6g87f6g87f6g87f6g87f6g87f6";
            
            var ws = new WebSocket(socketUrl);
            ws.onmessage = function(event) {
                try {
                    var data = JSON.parse(event.data);
                    if (data.user && data.text) {
                        displayMessage(data.user, data.text);
                    }
                } catch(e) {}
            };
            ws.onclose = function() { setTimeout(initChat, 2000); };
        }

        function sendMessage() {
            var input = document.getElementById('msg-input');
            var text = input.value.trim();
            if (text !== "") {
                var cleanHttp = mainDomain.replace(/\s/g, "");
                var sendUrl = cleanHttp + "/api/v1/publish";
                
                fetch(sendUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        apiKey: "o776f87f6g87f6g87f6g87f6g87f6g87f6",
                        channel: room,
                        message: { user: currentUsername, text: text }
                    })
                });
                input.value = "";
            }
        }

        function handleKey(e) { if (e.key === 'Enter') sendMessage(); }

        function displayMessage(user, text) {
            var box = document.getElementById('messages');
            var msgDiv = document.createElement('div');
            var isMe = user === currentUsername;
            msgDiv.classList.add('msg', isMe ? 'outgoing' : 'incoming');
            msgDiv.innerHTML = '<div class="username">' + user + '</div><div>' + text + '</div>';
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
